name: buildx

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'README.ja.md'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'README.ja.md'
      - 'docker-compose.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Opt in to Node.js 24 ahead of the 2026-06-02 default flip so the
  # deprecation banner stops firing on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  buildx:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Initial Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:testing
          platforms: linux/amd64
      - name: Load Built Image and Test
        run: |
          docker buildx build \
            -t ${{ env.IMAGE_NAME }}:testing \
            --platform=linux/amd64 \
            --load \
            .
          CID=$(docker run -d ${{ env.IMAGE_NAME }}:testing)
          sleep 8s
          if ! docker exec -i $CID usque version >/dev/null 2>&1; then
            echo "::error::usque version subcommand failed"
            docker logs $CID
            exit 1
          fi
          # Poll the SOCKS5 listener directly — faster and more meaningful
          # than waiting for the 25s HEALTHCHECK interval to first fire.
          ok=
          for i in $(seq 1 12); do
            if docker exec -i $CID curl -sf --max-time 8 \
                 -x socks5h://127.0.0.1:1080 \
                 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'; then
              ok=1
              echo "[$i] SOCKS5 -> warp=on"
              break
            fi
            echo "[$i] not ready yet"
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::SOCKS5 did not reach warp=on within 36s"
            docker logs $CID
            exit 1
          fi
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Buildx and Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
          push: true

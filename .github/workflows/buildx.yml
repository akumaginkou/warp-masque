name: buildx

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'docker-compose.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  buildx:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Initial Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:testing
          platforms: linux/amd64
      - name: Load Built Image and Test
        run: |
          docker buildx build \
            -t ${{ env.IMAGE_NAME }}:testing \
            --platform=linux/amd64 \
            --load \
            .
          CID=$(docker run -d ${{ env.IMAGE_NAME }}:testing)
          sleep 5s
          if ! docker exec -i $CID usque version >/dev/null 2>&1; then
            echo "::error::usque version subcommand failed"
            docker logs $CID
            exit 1
          fi
          # Wait up to 30s for the SOCKS5 listener + healthcheck to come up.
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' $CID 2>/dev/null || echo unknown)
            echo "[$i] health=$status"
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::container did not become healthy"
            docker logs $CID
            exit 1
          fi
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Buildx and Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          push: true
